<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Большая стройка</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pk:#ff2bd1;--pu:#9b3dff;--tx:#f1e6ff;--mut:#b99bff;--grad:linear-gradient(100deg,#7a2bd6,#ff2bd1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 85% 0,#3a0f86,transparent 45%),radial-gradient(circle at 0 100%,#5a1fb5,transparent 40%),#0b0118;color:var(--tx);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{background:rgba(11,1,24,.9);padding:14px 12px 12px;text-align:center;border-bottom:3px solid;border-image:linear-gradient(90deg,#7a2bd6,#ff2bd1,#ff7a3d) 1}
header img{height:30px;width:auto;display:block;margin:0 auto 10px;background:#fff;padding:6px 14px;border-radius:12px;box-shadow:0 0 18px #ff2bd166}
h1{margin:0;font-size:26px;font-weight:800;color:#fff}
h1 span{color:var(--pk);text-shadow:0 0 14px #ff2bd1}
.city{color:var(--mut);font-size:13px;margin-top:4px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:rgba(14,3,32,.94);backdrop-filter:blur(8px);padding:10px 12px;border-bottom:1px solid #3a1a7a}
.bar input{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--pk);background:#160536;color:#fff;font:inherit;font-size:16px;outline:none;box-shadow:0 0 12px #ff2bd155}
.bar input::placeholder{color:var(--mut)}
.bar input:focus{box-shadow:0 0 20px #ff2bd1}
#res{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:6px 12px;border-radius:999px;background:var(--grad);color:#fff;font-size:13px;cursor:pointer;box-shadow:0 0 10px #ff2bd188}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:12px;color:var(--mut);padding:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;box-shadow:0 0 8px currentColor}
#wrap{margin:0 8px;height:70vh;overflow:auto;border-radius:18px;border:2px solid #7a2bd6;box-shadow:0 0 24px #ff2bd144;background:#0b0118}
#map{padding:16px;width:1836px;zoom:.45;background:radial-gradient(circle at 50% 0,#2d0a6b,#0b0118 70%)}
.grid{position:relative;display:grid;grid-template-columns:repeat(11,124px);grid-template-rows:430px 430px 645px;gap:44px;background:radial-gradient(circle at 20% 30%,#24104f 0,transparent 35%),radial-gradient(circle at 75% 70%,#1f0c47 0,transparent 40%),repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 2px,transparent 2px 7px),#120531}
.dist{position:relative;min-width:0;background:radial-gradient(circle at 20% 15%,#5a24c0,transparent 45%),radial-gradient(circle at 80% 85%,#8a1fa8,transparent 50%),#22095a;border:4px solid #b44bff;border-radius:18px;padding:44px 6px 6px;display:grid;justify-items:center;align-items:end;align-content:space-evenly;box-shadow:0 0 0 3px #4a1fa0,0 0 0 7px #120531,0 0 0 9px #b44bff,0 0 18px 9px #9b3dff55}
.dist::before{content:attr(data-t);position:absolute;top:8px;left:14px;font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--grad);padding:3px 12px;border-radius:10px;box-shadow:0 0 12px #ff2bd1aa}
.dist[data-t="Район оформления"]::before{left:50%;transform:translateX(-50%)}
.st{background:repeating-linear-gradient(90deg,#ff9af0 0 22px,transparent 22px 44px) center/100% 3px no-repeat,#120531;height:44px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:#e9d8ff;border-top:4px solid #4a1fa0;border-bottom:4px solid #4a1fa0}
.st span{background:#120531;padding:0 12px}
.park{position:relative;min-width:0;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-evenly;align-content:space-evenly;padding:8px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 22px,transparent 22px 44px),radial-gradient(circle at 30% 20%,#b583ff,transparent 55%),radial-gradient(circle at 78% 82%,#d65bff,transparent 55%),#6a2fd0;border:4px solid #e0a3ff;border-radius:18px;box-shadow:0 0 0 3px #4a1fa0,0 0 0 7px #120531,0 0 0 9px #b44bff,0 0 18px 9px #9b3dff55}
.grid>.cell{position:absolute;z-index:5}
.cell{width:90px;height:196px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;transition:.2s}
.cell:hover{transform:translateY(-5px)}
.cell svg{overflow:visible;display:block}
.c0 svg{filter:drop-shadow(0 0 6px #ff4fd8)}.c1 svg{filter:drop-shadow(0 0 7px #b36bff)}.c2 svg{filter:drop-shadow(0 0 9px #ff2bb0)}.c3 svg{filter:drop-shadow(0 0 14px #ff9af0)}
.nm{position:relative;z-index:6;font-size:11px;font-weight:600;line-height:1.1;text-align:center;margin-top:3px;height:27px;width:92px;color:#fff;background:rgba(14,3,32,.9);border:1px solid #ff2bd1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 8px #ff2bd188}
.tg{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9px;font-weight:600;background:var(--grad);color:#fff;padding:2px 9px;border-radius:9px;z-index:7;box-shadow:0 0 8px #ff2bd1}
#mayor{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;padding-bottom:12px;background:repeating-linear-gradient(0deg,#ff2bd133 0 1px,transparent 1px 40px),repeating-linear-gradient(90deg,#ff2bd133 0 1px,transparent 1px 40px),radial-gradient(circle at 50% 70%,#4b1d9a,#1a0645 75%);border:4px solid #ff2bd1;border-radius:18px;box-shadow:0 0 0 3px #4a1fa0,0 0 0 7px #120531,0 0 0 9px #b44bff,0 0 24px 9px #ff2bd166}
#mayor svg{overflow:visible;filter:drop-shadow(0 0 12px #ff2bd1)}
.mn{font-size:15px;font-weight:700;text-align:center;margin-top:8px;color:#fff;background:var(--grad);border-radius:10px;padding:4px 14px;box-shadow:0 0 14px #ff2bd1}
.dim{opacity:.22}.hit{animation:p 1s infinite;z-index:6}
@keyframes p{50%{transform:scale(1.35);filter:drop-shadow(0 0 12px #fff)}}
.zm{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:8}
.zm button{width:46px;height:46px;border-radius:14px;border:0;background:var(--grad);color:#fff;font-size:24px;font-weight:700;box-shadow:0 0 14px #ff2bd1aa}
#m{position:fixed;inset:0;background:rgba(5,0,15,.72);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#m.s{display:flex}
.card{background:#150536;color:#fff;border:2px solid var(--pk);border-top:6px solid var(--pk);border-radius:18px;padding:20px;max-width:340px;width:100%;box-shadow:0 0 34px #ff2bd188}
.card h3{margin:0 0 4px;font-size:20px}
.card .k{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--grad);color:#fff;font-size:13px;margin:6px 0 12px}
.card p{margin:6px 0;font-size:15px}
.card button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:14px;background:var(--grad);color:#fff;font:inherit;font-weight:600;font-size:15px}
@media(min-width:900px){header{display:flex;align-items:center;justify-content:center;gap:24px;padding:16px 32px}header img{height:38px;margin:0}h1{font-size:28px}.city{margin:0}.bar{display:flex;align-items:center;gap:16px;padding:12px 32px;justify-content:center}.bar input{width:460px;flex:none}#res{margin-top:0;flex:1;max-width:900px}.legend{font-size:13px;gap:6px 22px;padding:12px 32px}#wrap{margin:0 24px 24px;height:calc(100vh - 250px);min-height:520px;cursor:grab}#wrap:active{cursor:grabbing}.zm{right:40px;bottom:40px}}
</style></head><body>
